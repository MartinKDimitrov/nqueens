// Which classes from outside a Compose module the compiler may treat as stable.
//
// Compose works out stability from metadata the Compose compiler itself emits, and the modules
// below are compiled without it: `:core:boardlogic` and `:core:puzzletype` are plain Kotlin, and
// that is the point of them. Without an answer the compiler assumes the worst, so a `Cell`, a
// `BoardSnapshot` or a `Puzzle` crossing into a composable makes every function that takes one
// unskippable — and the board is drawn again in full on every tick of the clock, 144 squares a
// second on the largest board.
//
// These types earn the promise the annotation would make: their fields are `val`, and the values
// behind them are integers, enums, resource ids and read-only lists that are rebuilt rather than
// written to. A type here that started mutating in place would go wrong silently, so keep the
// entries to packages whose contents are values.
com.mdimitrov.puzzles.boardlogic.*
com.mdimitrov.puzzles.puzzletype.*
