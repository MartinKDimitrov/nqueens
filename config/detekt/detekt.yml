# Overrides on top of detekt's defaults. Only rules that clash with Compose conventions
# are listed; everything else stays as detekt ships it.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    # A named property is the naming the rule asks for.
    ignorePropertyDeclaration: true
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/theme/**'